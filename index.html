<!-- Firebase's modern modular SDK, loaded as real ES modules — this is the current officially-supported way
     to load Firebase from a plain script tag at this SDK version. Everything it creates gets attached to
     window.fb so the plain (non-module) app script further down can use it. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY_HERE",
    authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "PASTE_YOUR_PROJECT_ID",
    storageBucket: "PASTE_YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "PASTE_YOUR_SENDER_ID",
    appId: "PASTE_YOUR_APP_ID",
  };

  const app = initializeApp(firebaseConfig);
  window.fb = {
    auth: getAuth(app),
    db: getFirestore(app),
    signInAnonymously, onAuthStateChanged, collection, doc, setDoc, deleteDoc, onSnapshot,
  };
</script>

/** Sums any flat numeric `bonus` entries in a subclass feature tier (foundation/specialization/mastery). */
function tierBonuses(subclassName, tier) {
  const feats = SUBCLASS_FEATURES[subclassName]?.[tier] || [];
  const sums = {};
  feats.forEach((f) => { if (f.bonus) sums[f.bonus.stat] = (sums[f.bonus.stat] || 0) + f.bonus.amount; });
  return sums;
}

/** True if this character's ancestry (or their Mixed Ancestry pick) includes a specific ancestry's feature
 * slot — 0 for the first listed feature, 1 for the second. A pure ancestry always has both; Mixed Ancestry
 * only has whichever single feature was actually chosen from that side. */
function hasAncestryFeature(char, ancestryName, featureIndex) {
  if (char.ancestry === ancestryName) return true;
  if (char.ancestry === "Mixed Ancestry") {
    if (char.mixedTop === ancestryName && char.mixedTopFeature === featureIndex) return true;
    if (char.mixedBottom === ancestryName && char.mixedBottomFeature === featureIndex) return true;
  }
  return false;
}

/** Flat, unconditional ancestry bonuses simple enough to auto-apply, same reasoning as armor and subclass
 * bonuses. Most ancestry features are conditional/reactive (mark a Stress to..., once per rest...) and stay
 * as reference text only, since auto-applying those would need real combat-state tracking we don't do. */
function ancestryBonuses(char) {
  return {
    hp: hasAncestryFeature(char, "Giant", 0) ? 1 : 0, // Endurance: +1 HP slot at creation
    stress: hasAncestryFeature(char, "Human", 0) ? 1 : 0, // High Stamina: +1 Stress slot at creation
    evasion: hasAncestryFeature(char, "Simiah", 1) ? 1 : 0, // Nimble: permanent +1 Evasion
    galapaShell: hasAncestryFeature(char, "Galapa", 0), // Shell: thresholds += current Proficiency (scales with level, so applied live rather than baked in at creation)
  };
}

/** The "X-Touched" bonus every domain has at level 7, unlocked once you have 4+ cards from that domain in
 * your loadout. Most grant advantage/roll bonuses we don't track as a number, or apply to a "Severe
 * threshold" concept this app simplifies away — these two are the ones that map cleanly onto stats we
 * already track, so recomputed live from however many matching cards are currently in the loadout. */
function domainTouchedBonuses(char) {
  // Only cards actually in the active loadout count toward a "4+ cards in your loadout" threshold —
  // vaulted cards you merely own don't count, per the rules.
  const cards = (char.domainCards || []).filter((c) => c.inLoadout !== false);
  const countIn = (domain) => cards.filter((c) => c.domain === domain).length;
  const traitBonus = {};
  if (countIn("Bone") >= 4) traitBonus.Agility = (traitBonus.Agility || 0) + 1; // Bone-Touched
  const spellcastTrait = SUBCLASS_FEATURES[char.subclass]?.spellcast;
  if (spellcastTrait && countIn("Arcana") >= 4) traitBonus[spellcastTrait] = (traitBonus[spellcastTrait] || 0) + 1; // Arcana-Touched
  return { traitBonus, armorSlotBonus: countIn("Valor") >= 4 ? 1 : 0 }; // Valor-Touched
}

/** Returns the character state restored to just before its most recent level-up, or null if there's no history. */
function rollbackSnapshot(character) {
  const history = character.levelHistory || [];
  if (history.length === 0) return null;
  const last = history[history.length - 1];
  return { ...last, levelHistory: history.slice(0, -1), advancementLog: [...(last.advancementLog || []), `Rolled back to level ${last.level}.`] };
}

/** Two-click in-app confirmation instead of native confirm()/alert() — arms on the first click (showing a
 * "Sure?" state for a few seconds) and only fires onConfirm on the second click. Nicer and more reliable
 * than a blocking browser popup, and works the same on every browser. */
function ConfirmAction({ label, confirmLabel = "Sure?", icon, confirmIcon, onConfirm, className = "", armedClassName = "" }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => {
    if (!armed) return;
    const t = setTimeout(() => setArmed(false), 3000);
    return () => clearTimeout(t);
  }, [armed]);
  return (
    <button
      onClick={(e) => {
        e.stopPropagation();
        if (armed) { setArmed(false); onConfirm(); }
        else setArmed(true);
      }}
      className={`flex items-center gap-1 ${armed ? armedClassName : className}`}
    >
      {armed ? (confirmIcon ?? icon) : icon}
      {armed ? confirmLabel : label}
    </button>
  );
}

function CopyButton({ text, className = "text-tiny text-muted hover-cream" }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1500); }
    catch { /* clipboard unavailable — the code is still shown as selectable text */ }
  };
  return <button onClick={copy} className={className}>{copied ? "Copied!" : "Copy"}</button>;
}

/** A code display with a robust copy button: tries navigator.clipboard first, falls back to the legacy
 * execCommand copy (some browsers restrict clipboard access on plain HTTP or older versions), and as a
 * last resort just selects the text so the person can copy it themselves with Ctrl/Cmd+C. */
function JoinCodeField({ code }) {
  const inputRef = useRef(null);
  const [status, setStatus] = useState("");

  const selectText = () => {
    const el = inputRef.current;
    if (el) { el.focus(); el.select(); }
  };

  const copy = async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(code); ok = true; } catch { /* fall through */ }
    if (!ok) {
      try { selectText(); ok = document.execCommand && document.execCommand("copy"); } catch { /* fall through */ }
    }
    if (ok) { setStatus("copied"); setTimeout(() => setStatus(""), 1500); }
    else { selectText(); setStatus("selected"); setTimeout(() => setStatus(""), 2500); }
  };

  return (
    <span className="flex items-center gap-1.5">
      <input ref={inputRef} readOnly value={code} onFocus={selectText} onClick={selectText}
        className="bg-transparent text-tiny text-gold border-none outline-none w-28" style={{ fontFamily: "monospace" }} />
      <button onClick={copy} className="text-tiny text-muted hover-cream whitespace-nowrap">
        {status === "copied" ? "Copied!" : status === "selected" ? "Selected — press Ctrl/Cmd+C" : "Copy"}
      </button>
    </span>
  );
}

  const [msg, setMsg] = useState("");

  const submit = () => {
    const found = tableRegistry.find((t) => t.code.toUpperCase() === code.trim().toUpperCase());
    if (!found) { setMsg("No table found with that code."); return; }
    onRedeem(found);
    setMsg(`Joined "${found.name}"${found.dmName ? ` (DM: ${found.dmName})` : ""}.`);
    setCode("");
  };

  return (
    <div className={compact ? "" : "sansUI"}>
      <div className="flex gap-2">
        <input value={code} onChange={(e) => { setCode(e.target.value); setMsg(""); }} onKeyDown={(e) => e.key === "Enter" && submit()}
          className="flex-1 bg-ink border border-line rounded px-3 py-2 text-sm" style={{ fontFamily: "monospace" }} placeholder="DM table code (optional)" />
        <button onClick={submit} className="px-3 py-2 rounded border border-line hoverable text-sm text-muted">Join</button>
      </div>
      {msg && <p className="text-tiny2 text-faint mt-1">{msg}</p>}
    </div>
  );
}

/** Weapon picker: a dropdown over the whole WEAPONS table (all tiers, no filtering — the character sheet
 * isn't a virtual tabletop, so we don't gatekeep which weapons someone can pick, they just found it). Selecting
 * a weapon auto-displays its trait/range/damage/type/burden/feature as a read-only reminder — purely cosmetic,
 * never used in any calculation. Falls back to a free-text field for homebrew weapons not in the SRD table,
 * and for old data saved before this feature existed. */
function WeaponField({ label, category, value, onChange }) {
  const known = value ? weaponData(value) : null;
  const list = WEAPONS.filter((w) => w.category === category).slice().sort((a, b) => a.tier - b.tier || a.name.localeCompare(b.name));
  const [forceCustom, setForceCustom] = useState(!!value && !known);
  const showCustomInput = forceCustom || (!!value && !known);
  return (
    <div>
      <label className="text-xs text-muted">{label}</label>
      <select className="w-full mt-1 bg-ink border border-line rounded px-3 py-2 sansUI"
        value={showCustomInput ? "__custom__" : (value || "")}
        onChange={(e) => {
          if (e.target.value === "__custom__") setForceCustom(true);
          else { setForceCustom(false); onChange(e.target.value); }
        }}>
        <option value="">— none —</option>
        {list.map((w) => <option key={w.name} value={w.name}>T{w.tier} · {w.name}</option>)}
        <option value="__custom__">Custom / homebrew…</option>
      </select>
      {showCustomInput && (
        <input className="w-full mt-1 bg-ink border border-line rounded px-3 py-2" placeholder="Weapon name"
          value={value || ""} onChange={(e) => onChange(e.target.value)} />
      )}
      {known && <p className="text-tiny2 text-faint mt-1">{weaponSummary(known)}</p>}
    </div>
  );
}

const DomainCardChip = ({ card, selected, onClick, disabled }) => (
  <button onClick={onClick} disabled={disabled}
    className={`w-full text-left p-2.5 rounded border sansUI ${selected ? "border-gold bg-surface2" : disabled ? "border-line opacity-40" : "border-line hoverable"}`}>
    <div className="flex items-center justify-between gap-2">
      <span className="flex items-center gap-1.5">
        <span style={{ backgroundColor: DOMAIN_COLORS[card.domain] }} className="w-2 h-2 rounded-full shrink-0" />
        <span className="text-sm">{card.name}</span>
      </span>
      <span className="text-tiny text-faint whitespace-nowrap">Lv {card.lvl} · {card.type} · Recall {card.recall}</span>
    </div>
    <p className="text-xs text-muted mt-1">{card.desc}</p>
  </button>
);

/** Inline or modal picker for domain cards, filtered to given domains and max level. */
function CardPicker({ domains, maxLevel, owned = [], onPick, onClose, modal = true }) {
  const ownedNames = owned.map((c) => c.name);
  const options = DOMAIN_CARDS.filter((c) => domains.includes(c.domain) && c.lvl <= maxLevel && !ownedNames.includes(c.name))
    .sort((a, b) => a.lvl - b.lvl || a.domain.localeCompare(b.domain));
  const body = (
    <div className="space-y-1.5 max-h-60vh overflow-y-auto pr-1">
      {options.map((c) => (
        <DomainCardChip key={c.name} card={c} onClick={() => onPick(c)} />
      ))}
      {options.length === 0 && <p className="text-xs text-faint sansUI">No new cards available at this level.</p>}
    </div>
  );
  if (!modal) return body;
  return (
    <div className="fixed inset-0 overlay flex items-center justify-center p-4 z-50 sansUI" onClick={onClose}>
      <div className="bg-surface border border-line rounded-md max-w-md w-full p-5 max-h-85vh overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-center mb-3">
          <h3 className="text-lg font-display">Add a domain card</h3>
          <button onClick={onClose} className="text-faint hover-cream"><X size={16} /></button>
        </div>
        {body}
      </div>
    </div>
  );
}

const SectionTitle = ({ children }) => (
  <h3 className="text-tiny2 tracking-wide text-muted uppercase font-display mb-2">{children}</h3>
);

function DaggerheartTracker() {
  const [view, setView] = useState("loading");
  const [characters, setCharacters] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [error, setError] = useState("");
  const [wizard, setWizard] = useState({ step: 0, data: blankCharacter() });
  // Personal identity lives in the browser's own localStorage — invisible to everyone else, and tied to
  // this device rather than to any account, plan, or login.
  const [role, setRole] = useState(() => { try { return localStorage.getItem("dh_role") || null; } catch { return null; } });
  const [viewerId, setViewerId] = useState(() => {
    try {
      let id = localStorage.getItem("dh_viewerId");
      if (!id) { id = genJoinCode(6); localStorage.setItem("dh_viewerId", id); }
      return id;
    } catch { return genJoinCode(6); }
  });
  const [tableFilter, setTableFilter] = useState("All");
  const [showAccountModal, setShowAccountModal] = useState(false);
  const [tableRegistry, setTableRegistry] = useState([]);

  // Silently sign in anonymously first — no login screen, the person never sees this happen — then start
  // live-syncing with Firestore. This is the actual security gate: our rules require request.auth != null,
  // so a raw script hitting the database directly (skipping this SDK-level sign-in) gets rejected, while any
  // real visitor to this page gets in transparently.
  useEffect(() => {
    let gotChars = false, gotTables = false;
    let unsubChars = () => {};
    let unsubTables = () => {};
    const maybeReady = () => { if (gotChars && gotTables) setView((v) => (v === "loading" ? "roster" : v)); };

    const unsubAuth = fb.onAuthStateChanged(fb.auth, (user) => {
      if (!user) return; // still signing in — the signInAnonymously() call below is in flight
      unsubChars();
      unsubTables();

      unsubChars = fb.onSnapshot(fb.collection(fb.db, "characters"),
        (snap) => {
          const chars = snap.docs.map((d) => d.data());
          chars.sort((a, b) => a.createdAt - b.createdAt);
          setCharacters(chars);
          setError("");
          gotChars = true;
          maybeReady();
        },
        (err) => { setError("Couldn't reach the shared database: " + err.message); gotChars = true; maybeReady(); }
      );

      unsubTables = fb.onSnapshot(fb.collection(fb.db, "tables"),
        (snap) => { setTableRegistry(snap.docs.map((d) => d.data())); gotTables = true; maybeReady(); },
        (err) => { setError("Couldn't reach the shared database: " + err.message); gotTables = true; maybeReady(); }
      );
    });

    fb.signInAnonymously(fb.auth).catch((err) => {
      setError(
        err.code === "auth/operation-not-allowed"
          ? "Anonymous sign-in isn't turned on for this Firebase project yet — enable it under Authentication → Sign-in method."
          : "Couldn't connect: " + err.message
      );
    });

    return () => { unsubAuth(); unsubChars(); unsubTables(); };
  }, []);

  const chooseRole = (r) => {
    setRole(r);
    try { localStorage.setItem("dh_role", r); } catch { /* stays in-memory for this session */ }
  };

  const switchRole = () => {
    setRole(null);
    setView("roster");
    try { localStorage.removeItem("dh_role"); } catch { /* ignore */ }
  };

  /** Switches this device to a different account code — everything tagged with that code (as owner or as a
   * table's DM) becomes "mine" again. This is the portability mechanism: not a real login, just a short code
   * a person carries themselves and re-enters wherever they open the link. */
  const reclaimAccount = (code) => {
    const clean = code.trim().toUpperCase();
    if (!clean) return false;
    setViewerId(clean);
    try { localStorage.setItem("dh_viewerId", clean); } catch { /* still applies for this session */ }
    return true;
  };

  // Firestore rejects any field whose value is literally `undefined` (unlike the old JSON.stringify-based
  // storage, which just silently dropped them). This round-trip strips those out the same way, defensively,
  // so a stray undefined never turns into a hard save failure.
  const cleanForFirestore = (obj) => JSON.parse(JSON.stringify(obj));

  const saveCharacter = async (char) => {
    try { await fb.setDoc(fb.doc(fb.db, "characters", char.id), cleanForFirestore(char)); }
    catch { setError("Save failed — your last change may not have synced."); }
  };

  const deleteCharacter = async (id) => {
    try { await fb.deleteDoc(fb.doc(fb.db, "characters", id)); } catch { /* ignore */ }
    if (activeId === id) { setActiveId(null); setView("roster"); }
  };

  const rollbackCharacter = async (id) => {
    const char = characters.find((c) => c.id === id);
    const next = char && rollbackSnapshot(char);
    if (!next) return;
    await saveCharacter(next);
  };

  const addCharacterToTable = async (char, table) => {
    await saveCharacter({ ...char, table: table.name, tableId: table.id });
  };

  const createTable = async (name, dmName) => {
    const t = { id: uid(), name: name.trim(), dmName: dmName.trim(), code: genJoinCode(), createdAt: Date.now(), dmViewerId: viewerId };
    try { await fb.setDoc(fb.doc(fb.db, "tables", t.id), cleanForFirestore(t)); return t; }
    catch { setError("Couldn't save the new table — try again."); return t; }
  };

  /** Deletes one table. Any characters linked to it are un-sorted (not deleted) so they fall back to the
   * shared "unclaimed" pool rather than becoming permanently orphaned. */
  const deleteTable = async (tableId) => {
    try { await fb.deleteDoc(fb.doc(fb.db, "tables", tableId)); } catch { /* ignore */ }
    const orphaned = characters.filter((c) => c.tableId === tableId);
    for (const c of orphaned) {
      await saveCharacter({ ...c, table: "", tableId: "", dmName: "" });
    }
  };

  const redeemTableCode = (code) =>
    tableRegistry.find((t) => t.code.toUpperCase() === code.trim().toUpperCase()) || null;

  // For the player-facing "casual label" autocomplete — deliberately only suggests names that are just plain
  // labels, never an actual registered table's name. That keeps the two concepts fully separate: typing a
  // label never accidentally links you to a real DM table, only redeeming an actual code does that.
  const registeredTableNames = new Set(tableRegistry.map((t) => t.name));
  const freeLabelNames = [...new Set(characters.map((c) => c.table).filter((t) => t && !registeredTableNames.has(t)))].sort();

  // A DM only ever sees the table(s) they personally created, plus anything not yet formally linked at all.
  // Matching is strictly by each table's unique ID — never by name — so a character's plain-text label can
  // never be mistaken for an actual link, coincidental name match or not.
  const myTables = tableRegistry.filter((t) => t.dmViewerId === viewerId);
  const myTableIds = new Set(myTables.map((t) => t.id));
  const myTableNames = myTables.map((t) => t.name);
  const dmCharacters = characters.filter((c) => (c.tableId ? myTableIds.has(c.tableId) : true));
  const legacyVisibleTableNames = [...new Set(dmCharacters.map((c) => c.table).filter((t) => t && !myTableNames.includes(t)))];
  const dmTableNames = [...new Set([...myTableNames, ...legacyVisibleTableNames])].sort();

  const myCharacters = characters.filter((c) => c.ownerId === viewerId);
  const visibleCharacters = role === "player" ? myCharacters : role === "dm" ? dmCharacters : characters;

  return (
    <div className="w-full min-h-app bg-ink text-cream p-4 sm:p-6" style={{ fontFamily: "Georgia, 'Iowan Old Style', serif" }}>
      <style>{`
        .sansUI { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
        input, select, textarea { font-family: inherit; }
        .font-display { font-family: Georgia, 'Iowan Old Style', serif; }
        .text-tiny { font-size: 10px; }
        .text-tiny2 { font-size: 11px; }

        .bg-ink { background-color: #171522; }
        .bg-surface { background-color: #221f30; }
        .bg-surface2 { background-color: #2f2b42; }
        .bg-dangerbg { background-color: #3a2229; }
        .bg-gold { background-color: #C9A227; }
        .bg-teal { background-color: #2E9C9C; }
        .overlay { background-color: rgba(0,0,0,0.6); overscroll-behavior: contain; }

        .crit-glow {
          border-width: 2px;
          border-image: linear-gradient(90deg, #C9A227, #8B5CF6) 1;
        }

        .text-cream { color: #EDE6DA; }
        .text-muted { color: #a49bc4; }
        .text-faint { color: #6b6480; }
        .text-gold { color: #C9A227; }
        .text-ink { color: #171522; }
        .text-danger { color: #e2a4a4; }
        .text-violet { color: #8B5CF6; }

        .border-line { border-color: #3a3552; }
        .border-gold { border-color: #C9A227; }
        .border-danger { border-color: #5c2f38; }

        input, select, textarea, button { border-color: inherit; }
        .border-line:focus, select.border-line:focus, input.border-line:focus, textarea.border-line:focus { border-color: #5c5480; outline: none; }

        .hoverable:hover { border-color: #5c5480; }
        .hover-gold-border:hover { border-color: #C9A227; }
        .hover-cream:hover { color: #EDE6DA; }
        .hover-danger:hover { color: #e2a4a4; }

        button, select { cursor: pointer; }
        .cursor-not-allowed { cursor: not-allowed; }

        .min-h-app { min-height: 600px; }
        .min-h-newchar { min-height: 110px; }
        .min-w-140 { min-width: 140px; }
        .max-h-60vh { max-height: 60vh; overscroll-behavior: contain; }
        .max-h-85vh { max-height: 85vh; overscroll-behavior: contain; }
      `}</style>

      <header className="flex items-center justify-between mb-6 max-w-5xl mx-auto">
        <button className="flex items-center gap-2" onClick={() => setView("roster")}>
          <Dices size={22} className="text-gold" />
          <span className="text-xl tracking-wide">Daggerheart Ledger</span>
        </button>
        <div className="flex items-center gap-3">
          {role && (
            <span className="sansUI text-tiny2 text-faint uppercase">
              Viewing as {role === "dm" ? "DM" : "Player"}
              {role === "player" && " (your characters only)"}
            </span>
          )}
          {viewerId && (
            <button onClick={() => setShowAccountModal(true)} className="sansUI text-xs text-muted hover-cream">Account</button>
          )}
          {role && (
            <button onClick={switchRole} className="sansUI text-xs text-muted hover-cream">Switch view</button>
          )}
          {view !== "roster" && role && (
            <button onClick={() => setView("roster")} className="sansUI text-xs text-muted hover-cream flex items-center gap-1">
              <ChevronLeft size={14} /> Roster
            </button>
          )}
        </div>
      </header>

      {showAccountModal && (
        <AccountModal viewerId={viewerId} onReclaim={reclaimAccount} onClose={() => setShowAccountModal(false)} />
      )}

      {error && (
        <div className="max-w-5xl mx-auto mb-4 text-xs sansUI text-danger bg-dangerbg border border-danger rounded px-3 py-2 flex items-center justify-between gap-3">
          <span>{error}</span>
          <button
            onClick={() => window.location.reload()}
            className="shrink-0 border border-danger rounded px-2 py-1 hover-cream"
          >
            Retry
          </button>
        </div>
      )}

      {view === "loading" && <p className="text-center sansUI text-muted">Loading the party...</p>}

      {view === "roster" && !role && (
        <RoleGate onChoose={chooseRole} viewerId={viewerId} onReclaim={reclaimAccount} />
      )}

      {view === "roster" && role && (
        <Roster
          characters={visibleCharacters}
          role={role}
          viewerId={viewerId}
          tables={dmTableNames}
          tableRegistry={myTables}
          tableFilter={tableFilter}
          setTableFilter={setTableFilter}
          onOpen={(id) => { setActiveId(id); setView("sheet"); }}
          onCreate={() => { setWizard({ step: 0, data: { ...blankCharacter(), ownerId: viewerId } }); setView("wizard"); }}
          onDelete={deleteCharacter}
          onRollback={rollbackCharacter}
          onAddByCode={addCharacterToTable}
          onCreateTable={createTable}
          onDeleteTable={deleteTable}
        />
      )}

      {view === "wizard" && (
        <Wizard
          wizard={wizard}
          setWizard={setWizard}
          existingTables={freeLabelNames}
          tableRegistry={tableRegistry}
          onFinish={async (char) => { await saveCharacter(char); setActiveId(char.id); setView("sheet"); }}
          onCancel={() => setView("roster")}
        />
      )}

      {view === "sheet" && activeId && (
        <Sheet
          character={characters.find((c) => c.id === activeId)}
          tableRegistry={tableRegistry}
          onChange={saveCharacter}
          onDelete={() => deleteCharacter(activeId)}
        />
      )}
    </div>
  );
}

function AddByCode({ characters, myTables, tableFilter, onAssign }) {
  const [code, setCode] = useState("");
  const initialTableId = () => {
    if (tableFilter === "All" || tableFilter === "Unsorted") return "";
    return myTables.find((t) => t.name === tableFilter)?.id || "";
  };
  const [targetTableId, setTargetTableId] = useState(initialTableId());
  const [msg, setMsg] = useState("");

  useEffect(() => {
    setTargetTableId(initialTableId());
    setMsg("");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tableFilter]);

  const submit = () => {
    const found = characters.find((c) => c.joinCode && c.joinCode.toUpperCase() === code.trim().toUpperCase());
    if (!found) { setMsg("No character found with that code — double-check it with the player."); return; }
    const table = myTables.find((t) => t.id === targetTableId);
    if (!table) { setMsg("Choose which of your tables to add it to."); return; }
    onAssign(found, table);
    setMsg(`Added "${found.name || "that character"}" to ${table.name}.`);
    setCode("");
  };

  if (myTables.length === 0) {
    return (
      <Card className="p-4 mb-4">
        <SectionTitle>Add a character by code</SectionTitle>
        <p className="text-xs text-muted sansUI">Create a table above first — then you can pull specific characters into it by their code.</p>
      </Card>
    );
  }

  return (
    <Card className="p-4 mb-4">
      <SectionTitle>Add a character by code</SectionTitle>
      <div className="flex flex-wrap gap-2 items-end sansUI text-sm">
        <div className="flex-1 min-w-140">
          <label className="text-xs text-muted">Join code</label>
          <input value={code} onChange={(e) => { setCode(e.target.value); setMsg(""); }} onKeyDown={(e) => e.key === "Enter" && submit()}
            className="w-full mt-1 bg-ink border border-line rounded px-3 py-2" style={{ fontFamily: "monospace" }} placeholder="e.g. 7F3K9QXPB2MJ" />
        </div>
        <div className="flex-1 min-w-140">
          <label className="text-xs text-muted">Add to table</label>
          <select value={targetTableId} onChange={(e) => { setTargetTableId(e.target.value); setMsg(""); }}
            className="w-full mt-1 bg-ink border border-line rounded px-3 py-2">
            <option value="">— choose one of your tables —</option>
            {myTables.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
        <button onClick={submit} className="px-4 py-2 rounded bg-gold text-ink">Add</button>
      </div>
      {msg && <p className="text-xs text-muted mt-2">{msg}</p>}
      <p className="text-tiny2 text-faint mt-2">Open a specific table tab above first and this defaults to it — handy when a player builds a character before you've set the table up.</p>
    </Card>
  );
}

function ManageTables({ tableRegistry, characters, onCreateTable, onDeleteTable }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [dmName, setDmName] = useState("");
  const [newTable, setNewTable] = useState(null);
  const [msg, setMsg] = useState("");

  const submit = async () => {
    if (!name.trim()) { setMsg("Give the table a name first."); return; }
    const result = await onCreateTable(name, dmName);
    if (result?.error) { setMsg(result.error); return; }
    setNewTable(result);
    setName("");
    setMsg("");
  };

  return (
    <Card className="p-4 mb-4">
      <div className="flex items-center justify-between">
        <SectionTitle>Tables you run ({tableRegistry.length})</SectionTitle>
        <button onClick={() => setOpen((o) => !o)} className="sansUI text-xs text-gold">{open ? "Hide" : "Manage"}</button>
      </div>
      {open && (
        <div className="sansUI">
          {tableRegistry.length > 0 && (
            <div className="space-y-1.5 mb-3">
              {tableRegistry.map((t) => (
                <div key={t.id} className="flex items-center justify-between bg-ink border border-line rounded p-2 text-sm gap-2">
                  <div className="flex-1 min-w-0">
                    <span>{t.name}</span>
                    {t.dmName && <span className="text-tiny text-faint"> · DM: {t.dmName}</span>}
                    <span className="text-tiny text-faint"> · {characters.filter((c) => c.tableId === t.id || c.table === t.name).length} character(s)</span>
                  </div>
                  <JoinCodeField code={t.code} />
                  <ConfirmAction
                    label="Delete" confirmLabel="Sure?" icon={<Trash2 size={12} />}
                    onConfirm={() => onDeleteTable(t.id)}
                    className="text-muted hover-danger" armedClassName="text-danger"
                  />
                </div>
              ))}
            </div>
          )}
          <div className="flex flex-wrap gap-2 items-end">
            <div className="flex-1 min-w-140">
              <label className="text-xs text-muted">New table name</label>
              <input value={name} onChange={(e) => { setName(e.target.value); setMsg(""); }} onKeyDown={(e) => e.key === "Enter" && submit()}
                className="w-full mt-1 bg-ink border border-line rounded px-3 py-2 text-sm" placeholder="e.g. Tuesday Group" />
            </div>
            <div className="flex-1 min-w-140">
              <label className="text-xs text-muted">Your DM name</label>
              <input value={dmName} onChange={(e) => setDmName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
                className="w-full mt-1 bg-ink border border-line rounded px-3 py-2 text-sm" placeholder="e.g. Florent" />
            </div>
            <button onClick={submit} className="px-4 py-2 rounded bg-gold text-ink text-sm">Create table</button>
          </div>
          {msg && <p className="text-xs text-danger mt-2">{msg}</p>}
          {newTable && (
            <div className="mt-3 p-3 rounded border border-gold bg-surface2 text-sm">
              <p className="mb-1">"{newTable.name}" created — share this code with your players:</p>
              <JoinCodeField code={newTable.code} />
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

function Roster({ characters, role, viewerId, tables, tableRegistry, tableFilter, setTableFilter, onOpen, onCreate, onDelete, onRollback, onAddByCode, onCreateTable, onDeleteTable }) {
  const isDm = role === "dm";
  const hasUnsorted = isDm && characters.some((c) => !c.table);
  const tabs = isDm ? ["All", ...tables, ...(hasUnsorted ? ["Unsorted"] : [])] : [];
  const displayed = isDm && tableFilter !== "All"
    ? characters.filter((c) => (c.table || "Unsorted") === tableFilter)
    : characters;

  return (
    <div className="max-w-5xl mx-auto">
      <p className="sansUI text-sm text-muted mb-4">
        {isDm
          ? "You're seeing the table(s) you created, plus anyone not yet sorted into a table. Other DMs' tables stay out of view — and you can still be a Player elsewhere by switching view."
          : "You're seeing every character you've created — across any table you play in. Each DM only sees their own table(s)."}
      </p>

      {isDm && tabs.length > 1 && (
        <div className="flex flex-wrap gap-1.5 mb-4 sansUI text-xs">
          {tabs.map((t) => (
            <button key={t} onClick={() => setTableFilter(t)}
              className={`px-2.5 py-1 rounded-full border ${tableFilter === t ? "border-gold bg-surface2 text-gold" : "border-line hoverable text-muted"}`}>
              {t}
            </button>
          ))}
        </div>
      )}

      {isDm && <ManageTables tableRegistry={tableRegistry} characters={characters} onCreateTable={onCreateTable} onDeleteTable={onDeleteTable} />}
      {isDm && <AddByCode characters={characters} myTables={tableRegistry} tableFilter={tableFilter} onAssign={onAddByCode} />}

      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        {displayed.map((c) => {
          const cls = classData(c.className);
          const historyCount = (c.levelHistory || []).length;
          const canRollback = historyCount > 0;
          return (
            <Card key={c.id} className="p-4 relative">
              <button onClick={() => onOpen(c.id)} className="text-left w-full flex gap-3">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1">
                    {cls && cls.domains.map((d) => (
                      <span key={d} style={{ backgroundColor: DOMAIN_COLORS[d] }} className="w-2.5 h-2.5 rounded-full" />
                    ))}
                    <span className="sansUI text-tiny uppercase tracking-wide text-muted">Level {c.level}</span>
                    {isDm && c.ownerId === viewerId && <span className="sansUI text-tiny uppercase tracking-wide text-gold">· Yours (as Player)</span>}
                    {c.table && <span className="sansUI text-tiny uppercase tracking-wide text-faint ml-auto">{c.table}</span>}
                    {isDm && !c.table && <span className="sansUI text-tiny uppercase tracking-wide text-faint ml-auto">Unsorted</span>}
                  </div>
                  <div className="text-lg leading-tight">{c.name || "Unnamed hero"}</div>
                  <div className="sansUI text-xs text-muted">{c.className}{c.subclass ? ` · ${c.subclass}` : ""}</div>
                  <div className="sansUI text-xs text-muted">{c.ancestry === "Mixed Ancestry" ? `${c.mixedTop}/${c.mixedBottom} Mixed` : c.ancestry} · {c.community}</div>
                </div>
              </button>
              <div className="flex items-center justify-between mt-3 pt-2 border-t border-line sansUI text-xs">
                {canRollback ? (
                  <ConfirmAction
                    label={`Level down${historyCount > 1 ? ` (${historyCount})` : ""}`} confirmLabel="Confirm?" icon={<ChevronLeft size={12} />}
                    onConfirm={() => onRollback(c.id)}
                    className="text-muted hover-cream" armedClassName="text-gold"
                  />
                ) : <span />}
                <ConfirmAction
                  label="Remove" confirmLabel="Confirm?" icon={<Trash2 size={12} />}
                  onConfirm={() => onDelete(c.id)}
                  className="text-muted hover-danger" armedClassName="text-danger"
                />
              </div>
            </Card>
          );
        })}
        <button onClick={onCreate} className="rounded-md border border-dashed border-line p-4 flex flex-col items-center justify-center gap-2 text-muted hover-cream hover-gold-border transition-colors min-h-newchar">
          <Plus size={20} />
          <span className="sansUI text-sm">New character</span>
        </button>
      </div>
      {displayed.length === 0 && (
        <p className="sansUI text-sm text-muted mt-6">{isDm ? "No one's arrived at this table yet." : "You haven't created a character yet"} — start the first sheet above.</p>
      )}
    </div>
  );
}

/*  WIZARD                                                             */

const STEPS = ["Identity", "Class", "Heritage", "Community", "Traits", "Domain Cards", "Equipment", "Background", "Review"];

function Wizard({ wizard, setWizard, existingTables, tableRegistry, onFinish, onCancel }) {
  const { step, data } = wizard;
  const set = (patch) => setWizard((w) => ({ ...w, data: { ...w.data, ...patch } }));
  const next = () => setWizard((w) => ({ ...w, step: Math.min(w.step + 1, STEPS.length - 1) }));
  const back = () => setWizard((w) => (w.step === 0 ? w : { ...w, step: w.step - 1 }));

  const canProceed = () => {
    if (step === 0) return data.name.trim().length > 0;
    if (step === 1) return data.className && data.subclass;
    if (step === 2) return data.ancestry && (data.ancestry !== "Mixed Ancestry" || (data.mixedTop && data.mixedBottom && data.mixedTop !== data.mixedBottom && data.mixedTopFeature !== undefined && data.mixedBottomFeature !== undefined));
    if (step === 3) return !!data.community;
    if (step === 4) return TRAIT_NAMES.every((t) => data.traits[t] !== undefined);
    if (step === 5) return (data.domainCards || []).length === 2;
    if (step === 6) return !!data.classItem;
    return true;
  };

  const finish = () => {
    const cls = classData(data.className);
    const arm = armorData(data.armor?.name || cls.armor);
    const foundation = tierBonuses(data.subclass, "foundation");
    const ancestry = ancestryBonuses(data);
    onFinish({
      ...data,
      evasion: cls.evasion + (foundation.evasion || 0) + ancestry.evasion,
      hp: { max: cls.hp + (foundation.hp || 0) + ancestry.hp, marked: 0 },
      stress: { max: (data.stress?.max || 6) + (foundation.stress || 0) + ancestry.stress, marked: 0 },
      armor: { name: arm.name, slots: { max: arm.score, marked: 0 } },
      thresholdBonus: foundation.thresholdBonus || 0,
      subclassTier: 1,
    });
  };

  return (
    <div className="max-w-2xl mx-auto">
      <div className="flex sansUI text-tiny uppercase tracking-wide text-muted gap-1 mb-5 flex-wrap">
        {STEPS.map((s, i) => (
          <span key={s} className={`px-2 py-1 rounded ${i === step ? "bg-teal text-ink" : i < step ? "text-gold" : ""}`}>{s}</span>
        ))}
      </div>

      <Card className="p-5">
        {step === 0 && <StepIdentity data={data} set={set} existingTables={existingTables} tableRegistry={tableRegistry} />}
        {step === 1 && <StepClass data={data} set={set} />}
        {step === 2 && <StepAncestry data={data} set={set} />}
        {step === 3 && <StepCommunity data={data} set={set} />}
        {step === 4 && <StepTraits data={data} set={set} />}
        {step === 5 && <StepDomainCards data={data} set={set} />}
        {step === 6 && <StepEquipment data={data} set={set} />}
        {step === 7 && <StepBackground data={data} set={set} />}
        {step === 8 && <StepReview data={data} />}
      </Card>

      <div className="flex justify-between mt-4">
        <button onClick={step === 0 ? onCancel : back} className="sansUI text-sm text-muted hover-cream flex items-center gap-1">
          <ChevronLeft size={14} /> {step === 0 ? "Cancel" : "Back"}
        </button>
        {step < STEPS.length - 1 ? (
          <button disabled={!canProceed()} onClick={next}
            className={`sansUI text-sm px-4 py-2 rounded flex items-center gap-1 ${canProceed() ? "bg-gold text-ink" : "bg-surface2 text-faint cursor-not-allowed"}`}>
            Next <ChevronRight size={14} />
          </button>
        ) : (
          <button onClick={finish} className="sansUI text-sm px-4 py-2 rounded bg-gold text-ink flex items-center gap-1">
            <Check size={14} /> Create character
          </button>
        )}
      </div>
    </div>
  );
}

        </div>

function StepTraits({ data, set }) {
  const traits = data.traits || {};
  const usedCount = (excludeTrait) => {
    const counts = {};
    TRAIT_NAMES.forEach((t) => {
      if (t === excludeTrait) return;
      const v = traits[t];
      if (v !== undefined) counts[v] = (counts[v] || 0) + 1;
    });
    return counts;
  };
  const poolCounts = TRAIT_POOL.reduce((acc, v) => { acc[v] = (acc[v] || 0) + 1; return acc; }, {});
  const availableFor = (trait) => {
    const used = usedCount(trait);
    return [2, 1, 0, -1].filter((v) => (poolCounts[v] || 0) - (used[v] || 0) > 0);
  };
  const assign = (trait, val) => set({ traits: { ...traits, [trait]: val === "" ? undefined : Number(val) } });
  const applySuggested = () => {
    const cls = classData(data.className);
    if (cls) set({ traits: { ...cls.suggested } });
  };
  const allAssigned = TRAIT_NAMES.every((t) => traits[t] !== undefined);

  return (
    <div className="sansUI">
      <div className="flex items-center justify-between mb-3">
        <SectionTitle>Assign your traits (+2, +1, +1, 0, 0, -1)</SectionTitle>
        {data.className && <button onClick={applySuggested} className="text-xs text-gold flex items-center gap-1"><Sparkles size={12} /> Use suggested spread</button>}
      </div>
      <div className="grid grid-cols-2 gap-3">
        {TRAIT_NAMES.map((t) => (
          <div key={t} className="flex items-center justify-between bg-ink border border-line rounded px-3 py-2">
            <span>{t}</span>
            <select className="bg-surface border border-line rounded px-2 py-1" value={traits[t] === undefined ? "" : traits[t]} onChange={(e) => assign(t, e.target.value)}>
              <option value="">—</option>
              {(traits[t] !== undefined ? [...new Set([traits[t], ...availableFor(t)])] : availableFor(t)).map((v) => (
                <option key={v} value={v}>{fmtMod(v)}</option>
              ))}
            </select>
          </div>
        ))}
      </div>
      {!allAssigned && <p className="text-xs text-muted mt-3">Assign a value to every trait to continue — each of +2, +1, +1, 0, 0, -1 is used exactly once.</p>}
    </div>
  );
}

function StepDomainCards({ data, set }) {
  const cls = classData(data.className);
  const chosen = data.domainCards || [];
  const options = cls ? DOMAIN_CARDS.filter((c) => cls.domains.includes(c.domain) && c.lvl === 1) : [];
  const toggle = (card) => {
    const already = chosen.find((c) => c.name === card.name);
    if (already) { set({ domainCards: chosen.filter((c) => c.name !== card.name) }); return; }
    if (chosen.length >= 2) return;
    set({ domainCards: [...chosen, card] });
  };
  return (
    <div className="sansUI">
      <SectionTitle>Choose two level-1 domain cards ({chosen.length}/2)</SectionTitle>
      <p className="text-xs text-faint mb-3">From your class's domains: {cls?.domains.join(" & ")}.</p>
      <div className="space-y-1.5">
        {options.map((c) => (
          <DomainCardChip key={c.name} card={c} selected={!!chosen.find((x) => x.name === c.name)}
            disabled={chosen.length >= 2 && !chosen.find((x) => x.name === c.name)} onClick={() => toggle(c)} />
        ))}
      </div>
    </div>
  );
}

function StepEquipment({ data, set }) {
  const cls = classData(data.className);
  const itemOptions = cls ? cls.item.split(/ or /i).map((s) => s.trim()) : [];
  useEffect(() => {
    if (cls && !data.weaponPrimary) set({ weaponPrimary: cls.primary, weaponSecondary: cls.secondary });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [cls]);
  const armorInfo = cls ? armorData(cls.armor) : null;
  return (
    <div className="sansUI space-y-4">
      <div>
        <SectionTitle>Weapons</SectionTitle>
        <div className="grid grid-cols-2 gap-3">
          <WeaponField label="Primary" category="Primary" value={data.weaponPrimary || ""} onChange={(v) => set({ weaponPrimary: v })} />
          <WeaponField label="Secondary" category="Secondary" value={data.weaponSecondary || ""} onChange={(v) => set({ weaponSecondary: v })} />
        </div>
        <p className="text-tiny2 text-faint mt-1">Any tier is selectable — the sheet is a reminder, not a virtual tabletop. Stats shown are for reference only.</p>
      </div>
      <div>
        <SectionTitle>Starting armor</SectionTitle>
        {armorInfo && (
          <div className="bg-ink border border-line rounded px-3 py-2 text-sm">
            {armorInfo.name} — thresholds {armorInfo.minor}/{armorInfo.major}, score {armorInfo.score}{armorInfo.feature ? `, ${armorInfo.feature}` : ""}
          </div>

        <p className="text-xs text-faint mt-1">Set by your class at level 1 — you can upgrade or swap armor later, from the character sheet.</p>
      </div>
      <div>
        <SectionTitle>Class item — choose one</SectionTitle>
        <div className="space-y-1.5">
          {itemOptions.map((opt) => (
            <button key={opt} onClick={() => set({ classItem: opt })}
              className={`w-full text-left text-sm p-2 rounded border ${data.classItem === opt ? "border-gold bg-surface2" : "border-line hoverable"}`}>{opt}</button>
          ))}
        </div>
      </div>
      <div>
        <SectionTitle>Starting gold</SectionTitle>
        <p className="text-xs text-muted">Most parties start with a couple of handfuls — adjust after character creation.</p>

    </div>

function StepBackground({ data, set }) {
  const exps = data.experiences?.length ? data.experiences : [{ text: "", bonus: 2 }, { text: "", bonus: 2 }];
  const setExp = (i, text) => {
    const list = [...exps]; list[i] = { ...list[i], text };
    set({ experiences: list });
  };
  return (
    <div className="sansUI space-y-4">
      <div>
        <SectionTitle>Experiences (each starts at +2)</SectionTitle>
        {exps.map((e, i) => (
          <input key={i} className="w-full mt-1 bg-ink border border-line rounded px-3 py-2" placeholder="e.g. Guild Rooftop Runner"
            value={e.text} onChange={(ev) => setExp(i, ev.target.value)} />
        ))}
      </div>
      <div>
        <SectionTitle>Background</SectionTitle>
        <textarea className="w-full bg-ink border border-line rounded px-3 py-2 h-20" value={data.background || ""} onChange={(e) => set({ background: e.target.value })} />
      </div>
      <div>
        <SectionTitle>Connections to the party</SectionTitle>
        <textarea className="w-full bg-ink border border-line rounded px-3 py-2 h-20" value={data.connections || ""} onChange={(e) => set({ connections: e.target.value })} />
      </div>
    </div>
  );
}

function StepReview({ data }) {
  const cls = classData(data.className);
  const arm = cls ? armorData(cls.armor) : null;
  const foundation = tierBonuses(data.subclass, "foundation");
  const ancestry = ancestryBonuses(data);
  const baseEvasion = (cls?.evasion || 0) + (foundation.evasion || 0) + ancestry.evasion;
  const finalEvasion = baseEvasion + (arm?.evasionMod || 0);
  const finalHp = (cls?.hp || 0) + (foundation.hp || 0) + ancestry.hp;
  return (
    <div className="sansUI text-sm space-y-1">
      <p className="text-lg" style={{ fontFamily: "Georgia, serif" }}>{data.name}{data.pronouns ? ` (${data.pronouns})` : ""}</p>
      <p className="text-muted">{data.className} · {data.subclass}</p>
      <p className="text-muted">{data.ancestry === "Mixed Ancestry" ? `Mixed: ${data.mixedTop} / ${data.mixedBottom}` : data.ancestry} · {data.community}</p>
      <p className="text-muted">Evasion {finalEvasion} · HP {finalHp} · Armor {cls?.armor}</p>
      <div className="flex flex-wrap gap-2 mt-2">
        {TRAIT_NAMES.map((t) => <span key={t} className="bg-ink border border-line rounded px-2 py-1">{t} {fmtMod(data.traits[t] ?? 0)}</span>)}
      </div>
      <p className="mt-2">Everything can still be edited from the character sheet afterward.</p>
    </div>
  );
}

/** Minimalist black-and-white print view of a character — everything on one flow, including every
 * domain card the character owns (not just the 5-card loadout limit, since there's no separate vault
 * field in the data model — this just lists the whole domainCards array). Uses the browser's native
 * print dialog rather than generating a PDF file, since there's no backend to build one server-side. */
function PrintSheet({ character: c, cls, arm, totalEvasion, minorThreshold, majorThreshold, armorSlotsMax, traitTotal, onClose }) {
  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-white text-black print-root">
      <style>{`
        @media print {
          body * { visibility: hidden; }
          .print-root, .print-root * { visibility: visible; }
          .print-root { position: absolute; inset: 0; overflow: visible; }
          .no-print { display: none !important; }
        }
        .print-root { font-family: Georgia, 'Times New Roman', serif; }
        .print-root h1, .print-root h2 { font-family: Georgia, serif; }
      `}</style>

      <div className="no-print sticky top-0 bg-white border-b border-black flex justify-between items-center px-4 py-2 sansUI">
        <span className="text-sm">Print preview — use your browser's Print (Control P or Command P), then close this.</span>
        <div className="flex items-center gap-2">
          <button onClick={() => window.print()} className="px-3 py-1.5 rounded bg-black text-white text-sm flex items-center gap-1">
            <Printer size={14} /> Print
          </button>
          <button onClick={onClose} className="px-3 py-1.5 rounded border border-black text-sm">Close</button>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-6 py-6 text-sm leading-snug">
        <h1 className="text-2xl">{c.name || "Unnamed hero"}{c.pronouns ? ` (${c.pronouns})` : ""}</h1>
        <p>{c.className} ({c.subclass}) · Level {c.level}, Tier {TIER_OF(c.level)} ·{" "}
          {c.ancestry === "Mixed Ancestry" ? `${c.mixedTop}/${c.mixedBottom} Mixed Ancestry` : c.ancestry} · {c.community}
        </p>
        {c.playerName && <p>Played by {c.playerName}</p>}

        <h2 className="text-lg mt-4 border-b border-black">Combat</h2>
        <p>
          Evasion: {totalEvasion} &nbsp; Armor: {arm.name} (Score {arm.score}, slots {armorSlotsMax}) &nbsp;
          HP: ___ / {c.hp?.max ?? 0} &nbsp; Stress: ___ / {c.stress?.max ?? 0}
        </p>
        <p>Minor threshold: {minorThreshold} &nbsp; Major threshold: {majorThreshold} &nbsp; Proficiency: {c.proficiency}</p>
        <p>Primary: {c.weaponPrimary || "—"}{weaponData(c.weaponPrimary) ? ` — ${weaponSummary(weaponData(c.weaponPrimary))}` : ""}</p>
        <p>Secondary: {c.weaponSecondary || "—"}{weaponData(c.weaponSecondary) ? ` — ${weaponSummary(weaponData(c.weaponSecondary))}` : ""}</p>

        <h2 className="text-lg mt-4 border-b border-black">Traits</h2>
        <p>{TRAIT_NAMES.map((t) => `${t} ${fmtMod(traitTotal(t))}`).join("   ·   ")}</p>

        <h2 className="text-lg mt-4 border-b border-black">Experiences</h2>
        {(c.experiences || []).length > 0 ? (
          <ul className="list-disc pl-5">
            {c.experiences.map((e, i) => <li key={i}>{e.text} {fmtMod(e.bonus)}</li>)}
          </ul>
        ) : <p>None yet.</p>}

        {(() => {
          const all = c.domainCards || [];
          const active = all.filter((card) => card.inLoadout !== false);
          const vaulted = all.filter((card) => card.inLoadout === false);
          const renderCard = (card, i) => (
            <p key={i}><b>{card.name}</b> — {card.domain}, Lv {card.lvl}, {card.type}, Recall {card.recall}. {card.desc}</p>
          );
          return (
            <>
              <h2 className="text-lg mt-4 border-b border-black">Loadout ({active.length}/5)</h2>
              {active.length > 0 ? <div className="space-y-1.5">{active.map(renderCard)}</div> : <p>None yet.</p>}
              <h2 className="text-lg mt-4 border-b border-black">Vault ({vaulted.length})</h2>
              {vaulted.length > 0 ? <div className="space-y-1.5">{vaulted.map(renderCard)}</div> : <p>Empty.</p>}
            </>
          );
        })()}

        <h2 className="text-lg mt-4 border-b border-black">Inventory</h2>
        {(c.inventory || []).length > 0 ? (
          <ul className="list-disc pl-5">{c.inventory.map((item, i) => <li key={i}>{item}</li>)}</ul>
        ) : <p>None listed.</p>}

        {c.background && (<><h2 className="text-lg mt-4 border-b border-black">Background</h2><p className="whitespace-pre-wrap">{c.background}</p></>)}
        {c.connections && (<><h2 className="text-lg mt-4 border-b border-black">Connections</h2><p className="whitespace-pre-wrap">{c.connections}</p></>)}
      </div>
    </div>
  );
}

function Sheet({ character, tableRegistry = [], onChange, onDelete }) {
  const [local, setLocal] = useState(character);
  const [rollResult, setRollResult] = useState(null);
  const [rollTrait, setRollTrait] = useState("Agility");
  const [advCount, setAdvCount] = useState(0); // number of advantage dice queued for the next roll
  const [disadvCount, setDisadvCount] = useState(0); // number of disadvantage dice queued for the next roll
  const [showLevelUp, setShowLevelUp] = useState(false);
  const [showCardPicker, setShowCardPicker] = useState(false);
  const [showPrint, setShowPrint] = useState(false);

  useEffect(() => { setLocal(character); }, [character?.id]);
  useEffect(() => {
    if (local && !local.joinCode) patch({ joinCode: genJoinCode() });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [local?.id]);
  if (!local) return null;

  const patch = (p) => { const next = { ...local, ...p }; setLocal(next); onChange(next); };
  const cls = classData(local.className);
  const arm = armorData(local.armor?.name);
  const subFeat = SUBCLASS_FEATURES[local.subclass];
  const ancBonus = ancestryBonuses(local);
  const touched = domainTouchedBonuses(local);
  const galapaBonus = ancBonus.galapaShell ? local.proficiency : 0;
  const minorThreshold = arm.minor + local.level + (local.thresholdBonus || 0) + galapaBonus;
  const majorThreshold = arm.major + local.level + (local.thresholdBonus || 0) + galapaBonus;
  const totalEvasion = local.evasion + (arm.evasionMod || 0);
  const traitTotal = (t) => (local.traits[t] ?? 0) + (touched.traitBonus[t] || 0);
  const armorSlotsMax = local.armor.slots.max + (touched.armorSlotBonus || 0);
  const loadoutCount = (local.domainCards || []).filter((c) => c.inLoadout !== false).length;
  const toggleCardLoadout = (i) => {
    const cards = [...local.domainCards];
    const active = cards[i].inLoadout !== false;
    if (!active && loadoutCount >= 5) return; // loadout full, ignore
    cards[i] = { ...cards[i], inLoadout: !active };
    patch({ domainCards: cards });
  };

  const roll = () => {
    const hopeDie = 1 + Math.floor(Math.random() * 12);
    const fearDie = 1 + Math.floor(Math.random() * 12);
    const mod = traitTotal(rollTrait);
    // Advantage and disadvantage dice cancel out one-for-one before rolling, per the rules — so only the
    // net excess on whichever side is larger actually gets rolled.
    const netAdv = advCount - disadvCount;
    const netCount = Math.abs(netAdv);
    const netSign = netAdv > 0 ? 1 : netAdv < 0 ? -1 : 0;
    const advDice = Array.from({ length: netCount }, () => 1 + Math.floor(Math.random() * 6));
    const advTotal = advDice.reduce((a, b) => a + b, 0);
    const total = hopeDie + fearDie + mod + netSign * advTotal;
    let outcome = hopeDie === fearDie ? "Critical Success!" : hopeDie > fearDie ? "Rolled with Hope" : "Rolled with Fear";
    setRollResult({ hopeDie, fearDie, mod, advDice, advTotal, netSign, total, outcome });
  };

  const addExperience = () => patch({ experiences: [...local.experiences, { text: "New Experience", bonus: 2 }] });
  const updateExperience = (i, field, val) => {
    const list = [...local.experiences]; list[i] = { ...list[i], [field]: val }; patch({ experiences: list });
  };
  const removeExperience = (i) => patch({ experiences: local.experiences.filter((_, idx) => idx !== i) });

  const addListItem = (field) => patch({ [field]: [...(local[field] || []), ""] });
  const updateListItem = (field, i, val) => {
    const list = [...local[field]]; list[i] = val; patch({ [field]: list });
  };
  const removeListItem = (field, i) => patch({ [field]: local[field].filter((_, idx) => idx !== i) });

  const setTrait = (t, v) => patch({ traits: { ...local.traits, [t]: v } });

  return (
    <div className="max-w-4xl mx-auto space-y-4 sansUI">
      {/* Header */}
      <Card className="p-5">
        <div className="flex flex-wrap justify-between items-start gap-3">
          <div className="flex items-start gap-4">
            <div>
            <input className="bg-transparent text-2xl border-b border-transparent border-line outline-none" style={{ fontFamily: "Georgia, serif" }}
              value={local.name} onChange={(e) => patch({ name: e.target.value })} />
            <div className="flex items-center gap-2 mt-1 text-xs text-muted">
              <input className="bg-transparent w-24 border-b border-transparent border-line outline-none" value={local.pronouns}
                onChange={(e) => patch({ pronouns: e.target.value })} placeholder="pronouns" />
              <span>· {local.className} ({local.subclass}) · {local.ancestry === "Mixed Ancestry" ? `${local.mixedTop}/${local.mixedBottom} Mixed` : local.ancestry} · {local.community}</span>
            </div>
            {local.playerName && <p className="text-tiny text-faint mt-1">Played by {local.playerName}</p>}
            <div className="flex items-center gap-1 mt-1">
              <span className="text-tiny text-faint">Table:</span>
              <input className="bg-transparent text-tiny text-faint border-b border-transparent border-line outline-none" value={local.table || ""}
                onChange={(e) => patch({ table: e.target.value })} placeholder="unsorted" />
              {local.dmName && <span className="text-tiny text-faint">· DM: {local.dmName}</span>}
              {(local.table || local.tableId) && (
                <ConfirmAction
                  label="Leave table" confirmLabel="Sure?" icon={null}
                  onConfirm={() => patch({ table: "", tableId: "", dmName: "" })}
                  className="text-tiny text-faint hover-danger" armedClassName="text-tiny text-danger"
                />
              )}
            </div>
            {!local.tableId && local.table && (
              <p className="text-tiny2 text-faint">Just a plain label, not a real link — redeem a table code below to actually connect to a DM's table.</p>
            )}
            {tableRegistry.length > 0 && !local.table && (
              <div className="mt-1 max-w-xs">
                <RedeemTableCode tableRegistry={tableRegistry} onRedeem={(t) => patch({ table: t.name, tableId: t.id, dmName: t.dmName })} compact />
              </div>
            )}
            {local.joinCode && (
              <div className="flex items-center gap-1.5 mt-1">
                <span className="text-tiny text-faint">Join code (give this to your DM):</span>
                <JoinCodeField code={local.joinCode} />
              </div>
            )}
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="text-center">
              <div className="text-2xl">{local.level}</div>
              <div className="text-tiny text-muted uppercase">Level · Tier {TIER_OF(local.level)}</div>
            </div>
            <button onClick={() => setShowLevelUp(true)} className="px-3 py-2 rounded bg-gold text-ink text-sm flex items-center gap-1">
              <ChevronRight size={14} /> Level up
            </button>
            <button onClick={() => setShowPrint(true)} className="px-3 py-2 rounded border border-line text-sm flex items-center gap-1 hover-cream sansUI">
              <Printer size={14} /> Print
            </button>
            {(local.levelHistory || []).length > 0 && (
              <ConfirmAction
                label={`Level down${local.levelHistory.length > 1 ? ` (${local.levelHistory.length})` : ""}`} confirmLabel="Confirm?" icon={<ChevronLeft size={14} />}
                onConfirm={() => { const next = rollbackSnapshot(local); if (next) patch(next); }}
                className="px-3 py-2 rounded border border-line hoverable text-muted text-sm"
                armedClassName="px-3 py-2 rounded border border-gold text-gold text-sm"
              />
            )}
          </div>
        </div>
        <div className="flex gap-1 mt-3">
          {cls?.domains.map((d) => (
            <span key={d} style={{ backgroundColor: DOMAIN_COLORS[d] + "33", borderColor: DOMAIN_COLORS[d], color: DOMAIN_COLORS[d] }} className="text-xs px-2 py-0.5 rounded-full border">{d}</span>
          ))}
        </div>
      </Card>

      {/* Traits + Roll */}
      <Card className="p-5">
        <SectionTitle>Traits</SectionTitle>
        <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-4">
          {TRAIT_NAMES.map((t) => (
            <button key={t} onClick={() => setRollTrait(t)}
              className={`p-2 rounded border text-center ${rollTrait === t ? "border-gold bg-surface2" : "border-line"}`}>
              <div className="text-tiny text-muted uppercase">{t}</div>
              <input type="number" className="w-full bg-transparent text-center text-lg outline-none" value={local.traits[t] ?? 0}
                onChange={(e) => setTrait(t, Number(e.target.value))} onClick={(e) => e.stopPropagation()} />
              {touched.traitBonus[t] > 0 && <div className="text-tiny text-gold">+{touched.traitBonus[t]} Touched</div>}
            </button>
          ))}
        </div>
        <div className="flex flex-wrap items-center gap-4">
          <button onClick={roll} className="px-3 py-2 rounded bg-teal text-ink flex items-center gap-1 text-sm">
            <Dices size={14} /> Roll Duality Dice ({rollTrait}{touched.traitBonus[rollTrait] ? ` ${fmtMod(traitTotal(rollTrait))} total` : ""})
          </button>
          <div className="flex items-center gap-1 text-tiny text-muted">
            <span>Advantage</span>
            <button onClick={() => setAdvCount(Math.max(0, advCount - 1))} className="w-5 h-5 rounded border border-line hover-cream">-</button>
            <span className="w-4 text-center text-gold">{advCount}</span>
            <button onClick={() => setAdvCount(advCount + 1)} className="w-5 h-5 rounded border border-line hover-cream">+</button>
          </div>
          <div className="flex items-center gap-1 text-tiny text-muted">
            <span>Disadvantage</span>
            <button onClick={() => setDisadvCount(Math.max(0, disadvCount - 1))} className="w-5 h-5 rounded border border-line hover-cream">-</button>
            <span className="w-4 text-center text-violet">{disadvCount}</span>
            <button onClick={() => setDisadvCount(disadvCount + 1)} className="w-5 h-5 rounded border border-line hover-cream">+</button>
          </div>
          {rollResult && (
            <div className={`text-sm px-3 py-2 rounded border border-transparent ${rollResult.hopeDie === rollResult.fearDie ? "crit-glow" : ""}`}>
              <span className="text-gold">Hope {rollResult.hopeDie}</span> + <span className="text-violet">Fear {rollResult.fearDie}</span> + {fmtMod(rollResult.mod)}
              {rollResult.advDice.length > 0 && (
                <> {rollResult.netSign > 0 ? "+" : "-"} <span className="text-teal">d6{rollResult.advDice.length > 1 ? "s" : ""} {rollResult.advDice.join(" + ")}</span></>
              )}
              {" "}= <b>{rollResult.total}</b>
              {rollResult.hopeDie === rollResult.fearDie ? <b className="text-gold"> Crit!</b> : <> — {rollResult.outcome}</>}
            </div>
          )}
        </div>
        {(advCount > 0 && disadvCount > 0) && (
          <p className="text-tiny2 text-faint mt-1">Advantage and disadvantage cancel out one-for-one, so only the net difference will actually be rolled.</p>
        )}
      </Card>

      {/* Subclass features */}
      {subFeat && (
        <Card className="p-5">
          <div className="flex items-center justify-between mb-2">
            <SectionTitle>{local.subclass} features {subFeat.spellcast ? `· Spellcast: ${subFeat.spellcast}` : ""}</SectionTitle>
            <span className="text-tiny text-faint uppercase">{local.subclassTier >= 3 ? "Mastery" : local.subclassTier >= 2 ? "Specialization" : "Foundation"} unlocked</span>
          </div>
          <div className="space-y-1.5">
            {subFeat.foundation.map((f) => (
              <div key={f.name} className="text-xs text-muted bg-ink border border-line rounded p-2">
                <span className="text-gold">{f.name}:</span> {f.desc}
              </div>
            ))}
            {local.subclassTier >= 2 && subFeat.specialization.map((f) => (
              <div key={f.name} className="text-xs text-muted bg-ink border border-gold rounded p-2">
                <span className="text-gold">{f.name} (Specialization):</span> {f.desc}
              </div>
            ))}
            {local.subclassTier >= 3 && subFeat.mastery.map((f) => (
              <div key={f.name} className="text-xs text-muted bg-ink border border-gold rounded p-2">
                <span className="text-gold">{f.name} (Mastery):</span> {f.desc}
              </div>
            ))}
          </div>
          {local.subclassTier < 3 && (
            <p className="text-tiny2 text-faint mt-2">Unlock {local.subclassTier === 1 ? "Specialization" : "Mastery"} by taking "an upgraded subclass card" as a level-up advancement — any matching permanent bonus is applied automatically when you do.</p>
          )}
        </Card>
      )}

      {/* Resources */}
      <div className="grid sm:grid-cols-2 gap-4">
        <Card className="p-5">
          <SectionTitle>Hit points ({local.hp.max - local.hp.marked} / {local.hp.max})</SectionTitle>

          <div className="flex gap-2 mt-2">
            <button onClick={() => patch({ hp: { ...local.hp, max: local.hp.max + 1 } })} className="text-xs text-muted flex items-center gap-0.5"><Plus size={10} /> slot</button>
            <button onClick={() => patch({ hp: { ...local.hp, max: Math.max(1, local.hp.max - 1) } })} className="text-xs text-muted flex items-center gap-0.5"><Minus size={10} /> slot</button>
          </div>
        </Card>
        <Card className="p-5">
          <SectionTitle>Stress ({local.stress.max - local.stress.marked} / {local.stress.max})</SectionTitle>
          <PipRow max={local.stress.max} marked={local.stress.marked} color="#8B5CF6" onChange={(n) => patch({ stress: { ...local.stress, marked: n } })} />
          <div className="flex gap-2 mt-2">
            <button onClick={() => patch({ stress: { ...local.stress, max: local.stress.max + 1 } })} className="text-xs text-muted flex items-center gap-0.5"><Plus size={10} /> slot</button>
            <button onClick={() => patch({ stress: { ...local.stress, max: Math.max(1, local.stress.max - 1) } })} className="text-xs text-muted flex items-center gap-0.5"><Minus size={10} /> slot</button>
          </div>
        </Card>
        <Card className="p-5">
          <SectionTitle>Hope ({local.hope.marked} / {local.hope.max})</SectionTitle>
          <PipRow max={local.hope.max} marked={local.hope.marked} color="#C9A227" onChange={(n) => patch({ hope: { ...local.hope, marked: n } })} />
        </Card>
        <Card className="p-5">
          <SectionTitle>Armor slots ({armorSlotsMax - local.armor.slots.marked} / {armorSlotsMax}){touched.armorSlotBonus > 0 && <span className="text-gold"> +{touched.armorSlotBonus} Touched</span>}</SectionTitle>
          <PipRow max={armorSlotsMax} marked={local.armor.slots.marked} color="#5C8A4A" onChange={(n) => patch({ armor: { ...local.armor, slots: { ...local.armor.slots, marked: n } } })} />
        </Card>
      </div>

      {/* Combat stats */}
      <Card className="p-5">
        <SectionTitle>Combat</SectionTitle>
        <div className="grid grid-cols-2 sm:grid-cols-6 gap-3 text-sm">
          <div><div className="text-tiny text-muted uppercase">Base Evasion</div>
            <input type="number" className="bg-transparent text-lg outline-none w-full" value={local.evasion} onChange={(e) => patch({ evasion: Number(e.target.value) })} /></div>
          <div><div className="text-tiny text-muted uppercase">Evasion (total)</div><div className="text-lg text-gold">{totalEvasion}</div></div>
          <div><div className="text-tiny text-muted uppercase">Proficiency</div>
            <input type="number" className="bg-transparent text-lg outline-none w-full" value={local.proficiency} onChange={(e) => patch({ proficiency: Number(e.target.value) })} /></div>
          <div><div className="text-tiny text-muted uppercase">Threshold bonus</div>
            <input type="number" className="bg-transparent text-lg outline-none w-full" value={local.thresholdBonus || 0} onChange={(e) => patch({ thresholdBonus: Number(e.target.value) })} /></div>
