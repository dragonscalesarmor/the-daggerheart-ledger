          <div><div className="text-tiny text-muted uppercase">Major threshold</div><div className="text-lg">{majorThreshold}</div></div>
        </div>
        <p className="text-tiny2 text-faint mt-2">
          Below minor: mark 1 HP · minor–major: mark 2 HP · at/above major: mark 3 HP.
          Evasion and thresholds are calculated dynamically: they already account for any bonus your ancestry, armor, or subclass may give you. Edit the base numbers directly for anything not yet auto-tracked.
        </p>
        <div className="mt-3">
          <label className="text-xs text-muted">Armor</label>
          <select className="w-full mt-1 bg-ink border border-line rounded px-3 py-2" value={local.armor.name}
            onChange={(e) => { const a = armorData(e.target.value); patch({ armor: { name: a.name, slots: { max: a.score, marked: 0 } } }); }}>
            {ARMORS.filter((a) => a.tier <= TIER_OF(local.level) || a.name === local.armor.name)
              .map((a) => <option key={a.name} value={a.name}>T{a.tier} · {a.name} ({a.minor}/{a.major}, score {a.score})</option>)}
          </select>
          <p className="text-tiny2 text-faint mt-1">You can't equip armor above your own tier (Tier {TIER_OF(local.level)}) — the list is filtered accordingly.</p>
        </div>
        <div className="grid grid-cols-2 gap-3 mt-3">
          <WeaponField label="Primary weapon" category="Primary" value={local.weaponPrimary || ""} onChange={(v) => patch({ weaponPrimary: v })} />
          <WeaponField label="Secondary weapon" category="Secondary" value={local.weaponSecondary || ""} onChange={(v) => patch({ weaponSecondary: v })} />
        </div>
        <p className="text-tiny2 text-faint mt-1">Any tier is selectable — found a better weapon? Just pick it. Stats shown are for reference only.</p>
      </Card>

      {/* Gold */}
      <Card className="p-5">
        <SectionTitle>Gold</SectionTitle>
        <div className="grid grid-cols-3 gap-4">
          {[["handfuls", "Handfuls"], ["bags", "Bags"], ["chests", "Chests"]].map(([key, label]) => (
            <div key={key}>
              <div className="text-xs text-muted mb-1">{label}</div>
              <PipRow max={9} marked={local.gold[key]} color="#C9A227" size={14} onChange={(n) => patch({ gold: { ...local.gold, [key]: n } })} />
            </div>
          ))}
        </div>
      </Card>

      {/* Experiences */}
      <Card className="p-5">
        <div className="flex justify-between items-center mb-2">
          <SectionTitle>Experiences</SectionTitle>
          <button onClick={addExperience} className="text-xs text-gold flex items-center gap-1"><Plus size={12} /> add</button>
        </div>
        <div className="space-y-2">
          {local.experiences.map((e, i) => (
            <div key={i} className="flex items-center gap-2">
              <input className="flex-1 bg-ink border border-line rounded px-3 py-1.5" value={e.text} onChange={(ev) => updateExperience(i, "text", ev.target.value)} />
              <input type="number" className="w-16 bg-ink border border-line rounded px-2 py-1.5 text-center" value={e.bonus} onChange={(ev) => updateExperience(i, "bonus", Number(ev.target.value))} />
              <button onClick={() => removeExperience(i)} className="text-muted hover-danger"><X size={14} /></button>
            </div>
          ))}
          {local.experiences.length === 0 && <p className="text-xs text-faint">No experiences yet.</p>}
        </div>
      </Card>

      {/* Domain cards */}
      <Card className="p-5">
        <div className="flex justify-between items-center mb-2">
          <SectionTitle>Domain cards ({loadoutCount}/5 in loadout, {(local.domainCards || []).length} owned)</SectionTitle>
          <button onClick={() => setShowCardPicker(true)} className="text-xs text-gold flex items-center gap-1"><Plus size={12} /> add card</button>
        </div>
        <div className="space-y-1.5">
          {(local.domainCards || []).map((c, i) => {
            const active = c.inLoadout !== false;
            return (
              <div key={i} className="flex items-start gap-2">
                <label className="mt-3 flex items-center shrink-0" title={active ? "In loadout — click to vault" : "Vaulted — click to activate"}>
                  <input type="checkbox" checked={active} disabled={!active && loadoutCount >= 5}
                    onChange={() => toggleCardLoadout(i)} />
                </label>
                <div className="flex-1"><DomainCardChip card={c} selected={active} /></div>
                <button onClick={() => patch({ domainCards: local.domainCards.filter((_, idx) => idx !== i) })} className="text-muted hover-danger mt-2"><X size={14} /></button>
              </div>
            );
          })}
          {(!local.domainCards || local.domainCards.length === 0) && <p className="text-xs text-faint">No domain cards yet.</p>}
        </div>
        <p className="text-xs text-faint mt-2">
          Only 5 cards can be active in your loadout at once — check the box on the ones you're currently using; the rest sit in your vault.
          {loadoutCount >= 5 && " Loadout full — uncheck one before activating another."}
        </p>
        {showCardPicker && cls && (
          <CardPicker domains={cls.domains} maxLevel={local.level} owned={local.domainCards || []}
            onPick={(card) => {
              const inLoadout = loadoutCount < 5;
              patch({ domainCards: [...(local.domainCards || []), { ...card, inLoadout }] });
              setShowCardPicker(false);
            }}
            onClose={() => setShowCardPicker(false)} />
        )}
      </Card>

      {/* Inventory */}
      <Card className="p-5">
        <div className="flex justify-between items-center mb-2">
          <SectionTitle>Inventory</SectionTitle>
          <button onClick={() => addListItem("inventory")} className="text-xs text-gold flex items-center gap-1"><Plus size={12} /> add</button>
        </div>
        <div className="space-y-2">
          {(local.inventory || []).map((v, i) => (
            <div key={i} className="flex items-center gap-2">
              <input className="flex-1 bg-ink border border-line rounded px-3 py-1.5" value={v} onChange={(e) => updateListItem("inventory", i, e.target.value)} placeholder="Item" />
              <button onClick={() => removeListItem("inventory", i)} className="text-muted hover-danger"><X size={14} /></button>
            </div>
          ))}
        </div>
        <p className="text-xs text-faint mt-2">Class item: {local.classItem}</p>
      </Card>

      {/* Background */}
      <Card className="p-5">
        <SectionTitle>Background</SectionTitle>
        <textarea className="w-full bg-ink border border-line rounded px-3 py-2 h-20 mb-3" value={local.background} onChange={(e) => patch({ background: e.target.value })} />
        <SectionTitle>Connections</SectionTitle>
        <textarea className="w-full bg-ink border border-line rounded px-3 py-2 h-20" value={local.connections} onChange={(e) => patch({ connections: e.target.value })} />
      </Card>

      {/* Advancement log */}
      {local.advancementLog?.length > 0 && (
        <Card className="p-5">
          <SectionTitle>Advancement history</SectionTitle>
          <ul className="text-xs text-muted space-y-1 list-disc list-inside">
            {local.advancementLog.map((l, i) => <li key={i}>{l}</li>)}
          </ul>
        </Card>
      )}

      <div className="flex justify-end">
        <ConfirmAction
          label="Remove character" confirmLabel="Confirm removal?" icon={<Trash2 size={12} />}
          onConfirm={onDelete}
          className="text-xs text-muted hover-danger" armedClassName="text-xs text-danger"
        />
      </div>

      {showLevelUp && <LevelUpModal character={local} onApply={(next) => {
        const { levelHistory, ...snapshot } = local;
        patch({ ...next, levelHistory: [...(levelHistory || []), snapshot] });
        setShowLevelUp(false);
      }} onClose={() => setShowLevelUp(false)} />}

      {showPrint && (
        <PrintSheet
          character={local} cls={cls} arm={arm} totalEvasion={totalEvasion}
          minorThreshold={minorThreshold} majorThreshold={majorThreshold}
          armorSlotsMax={armorSlotsMax} traitTotal={traitTotal}
          onClose={() => setShowPrint(false)}
        />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  LEVEL UP MODAL                                                     */
/* ------------------------------------------------------------------ */

function LevelUpModal({ character, onApply, onClose }) {
  const newLevel = character.level + 1;
  const cls = classData(character.className);
  const [picked, setPicked] = useState([]);
  const [traitPicks, setTraitPicks] = useState([]);
  const [newCard, setNewCard] = useState(null);
  const tierAchievement = newLevel === 2 || newLevel === 5 || newLevel === 8;

  const totalCost = picked.reduce((s, id) => s + ADVANCEMENTS.find((a) => a.id === id).cost, 0);
  const toggle = (id) => {
    const cost = ADVANCEMENTS.find((a) => a.id === id).cost;
    if (picked.includes(id)) { setPicked(picked.filter((p) => p !== id)); return; }
    if (totalCost + cost > 2) return;
    setPicked(cost === 2 ? [id] : [...picked, id]);
  };

  const apply = () => {
    let next = { level: newLevel };
    const log = [`Reached level ${newLevel}.`];
    if (tierAchievement) {
      next.proficiency = character.proficiency + 1;
      next.experiences = [...character.experiences, { text: "New Experience", bonus: 2 }];
      log.push("Tier achievement: +1 Proficiency, gained a new Experience (+2).");
      if (newLevel === 5 || newLevel === 8) {
        next.traits = Object.fromEntries(TRAIT_NAMES.map((t) => [t, 0]));
        log.push("Cleared marked traits for the new tier.");
      }
    }
    picked.forEach((id) => {
      if (id === "hp") { next.hp = { ...character.hp, max: character.hp.max + 1 }; log.push("Advancement: +1 Hit Point slot."); }
      if (id === "stress") { next.stress = { ...character.stress, max: character.stress.max + 1 }; log.push("Advancement: +1 Stress slot."); }
      if (id === "evasion") { next.evasion = character.evasion + 1; log.push("Advancement: +1 Evasion."); }
      if (id === "armorslot") { next.armor = { ...character.armor, slots: { ...character.armor.slots, max: character.armor.slots.max + 1 } }; log.push("Advancement: +1 Armor Slot."); }
      if (id === "subclass") {
        const curTier = character.subclassTier || 1;
        if (curTier < 3) {
          const tierKey = curTier === 1 ? "specialization" : "mastery";
          next.subclassTier = curTier + 1;
          const bonus = tierBonuses(character.subclass, tierKey);
          if (bonus.evasion) next.evasion = (next.evasion ?? character.evasion) + bonus.evasion;
          if (bonus.hp) { const base = next.hp ?? character.hp; next.hp = { ...base, max: base.max + bonus.hp }; }
          if (bonus.stress) { const base = next.stress ?? character.stress; next.stress = { ...base, max: base.max + bonus.stress }; }
          if (bonus.thresholdBonus) next.thresholdBonus = (next.thresholdBonus ?? character.thresholdBonus ?? 0) + bonus.thresholdBonus;
          const featNames = (SUBCLASS_FEATURES[character.subclass]?.[tierKey] || []).map((f) => f.name).join(", ");
          log.push(`Advancement: unlocked ${tierKey === "specialization" ? "Specialization" : "Mastery"} subclass features (${featNames}).`);
        } else {
          log.push("Advancement: took an upgraded subclass card, but Mastery was already fully unlocked.");
        }
      }
      if (id === "domaincard" && newCard) {
        next.domainCards = [...(character.domainCards || []), newCard];
        log.push(`Advancement: added the domain card "${newCard.name}".`);
      }
      if (id === "proficiency") { next.proficiency = (next.proficiency ?? character.proficiency) + 1; log.push("Advancement: +1 Proficiency (used both picks)."); }
      if (id === "traits" && traitPicks.length === 2) {
        const base = next.traits || character.traits;
        next.traits = { ...base, [traitPicks[0]]: (base[traitPicks[0]] ?? 0) + 1, [traitPicks[1]]: (base[traitPicks[1]] ?? 0) + 1 };
        log.push(`Advancement: +1 to ${traitPicks[0]} and ${traitPicks[1]}.`);
      }
    });
    next.advancementLog = [...(character.advancementLog || []), ...log];
    onApply(next);
  };

  const traitsChosen = picked.includes("traits");
  const domainCardChosen = picked.includes("domaincard");
  const canApply = tierAchievement || totalCost > 0;

  return (
    <div className="fixed inset-0 overlay flex items-center justify-center p-4 z-50 sansUI" onClick={onClose}>
      <div className="bg-surface border border-line rounded-md max-w-md w-full p-5 max-h-85vh overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <h3 className="text-lg mb-1" style={{ fontFamily: "Georgia, serif" }}>Level up to {newLevel}</h3>
        <p className="text-xs text-muted mb-3">Tier {TIER_OF(newLevel)}{tierAchievement ? " — new tier achievement!" : ""}</p>
        {tierAchievement && (
          <div className="text-xs bg-ink border border-line rounded p-2 mb-3">
            +1 Proficiency, a new Experience at +2{(newLevel === 5 || newLevel === 8) ? ", and all marked traits are cleared" : ""}.
          </div>
        )}
        <p className="text-xs text-muted mb-2">Choose advancements (2 points):</p>
        <div className="space-y-1.5 mb-3">
          {ADVANCEMENTS.map((a) => (
            <label key={a.id} className={`flex items-center gap-2 text-sm p-2 rounded border cursor-pointer ${picked.includes(a.id) ? "border-gold bg-surface2" : "border-line"}`}>
              <input type="checkbox" checked={picked.includes(a.id)} onChange={() => toggle(a.id)} />
              {a.label}{a.cost === 2 ? " (costs both picks)" : ""}
            </label>
          ))}
        </div>
        {traitsChosen && (
          <div className="mb-3">
            <p className="text-xs text-muted mb-1">Pick two traits to raise:</p>
            <div className="grid grid-cols-3 gap-1.5">
              {TRAIT_NAMES.map((t) => (
                <button key={t} onClick={() => setTraitPicks((prev) => prev.includes(t) ? prev.filter((x) => x !== t) : prev.length < 2 ? [...prev, t] : prev)}
                  className={`text-xs p-1.5 rounded border ${traitPicks.includes(t) ? "border-gold bg-surface2" : "border-line"}`}>{t}</button>
              ))}
            </div>
          </div>
        )}
        {domainCardChosen && cls && (
          <div className="mb-3">
            <p className="text-xs text-muted mb-1">Pick your new domain card:</p>
            {newCard ? (
              <div className="flex items-start gap-2">
                <div className="flex-1"><DomainCardChip card={newCard} selected /></div>
                <button onClick={() => setNewCard(null)} className="text-muted hover-danger mt-2"><X size={14} /></button>
              </div>
            ) : (
              <CardPicker modal={false} domains={cls.domains} maxLevel={newLevel} owned={character.domainCards || []} onPick={setNewCard} />
            )}
          </div>
        )}
        <div className="flex justify-end gap-2 mt-4">
          <button onClick={onClose} className="text-sm text-muted px-3 py-2">Cancel</button>
          <button disabled={!canApply || (traitsChosen && traitPicks.length !== 2) || (domainCardChosen && !newCard)} onClick={apply}
            className={`text-sm px-4 py-2 rounded ${canApply ? "bg-gold text-ink" : "bg-surface2 text-faint"}`}>Confirm level up</button>
        </div>
      </div>
    </div>
  );
}

// Mount the app. `db` comes from the small Firebase setup script loaded just before this one in index.html.
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DaggerheartTracker />);

</script>
